name: Compilar Prueba Proxy

on:
  push:
    branches: [ prueba-proxy ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk Prueba-Proxy.apk
      - name: Publicar en la versión "prueba-proxy"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-proxy
          target_commitish: ${{ github.sha }}
          name: Prueba Proxy - última versión
          files: Prueba-Proxy.apk
          body: "versionCode=${{ github.run_number }}"
          make_latest: false
