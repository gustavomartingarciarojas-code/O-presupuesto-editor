name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk 0-Presupuesto-Editor.apk
      - name: Publicar en la versión "ultima"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: 0 Presupuesto Editor - última versión
          files: 0-Presupuesto-Editor.apk
          make_latest: true
